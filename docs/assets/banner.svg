<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AI Prompt Toolkit — a local-first prompt library for your browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0d1326"/>
      <stop offset="1" stop-color="#140f2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8dff"/>
      <stop offset="1" stop-color="#b06bff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c8dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b06bff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c2e0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="120" cy="40" r="300" fill="url(#glow1)"/>
    <circle cx="1080" cy="300" r="320" fill="url(#glow2)"/>

    <g stroke="#ffffff" stroke-opacity="0.045">
      <path d="M0 80h1200M0 160h1200M0 240h1200"/>
      <path d="M200 0v320M400 0v320M600 0v320M800 0v320M1000 0v320"/>
    </g>

    <!-- logo mark -->
    <g transform="translate(72 96)">
      <rect width="72" height="72" rx="20" fill="url(#accent)"/>
      <g fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" transform="translate(8 8) scale(0.875)">
        <path d="M32 14l4.6 11.4L48 30l-11.4 4.6L32 46l-4.6-11.4L16 30l11.4-4.6z"/>
        <path d="M46.5 42.5l1.3 3.2 3.2 1.3-3.2 1.3-1.3 3.2-1.3-3.2-3.2-1.3 3.2-1.3z"/>
      </g>
    </g>

    <!-- wordmark -->
    <text x="176" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="54" font-weight="700" letter-spacing="-1.4" fill="url(#title)">AI Prompt Toolkit</text>
    <text x="178" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="20" font-weight="500" fill="#98a3bd">Save, search, template and reuse your AI prompts — entirely in your browser.</text>

    <!-- feature pills -->
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600">
      <g transform="translate(178 212)">
        <rect width="132" height="34" rx="17" fill="#7c8dff" fill-opacity="0.14" stroke="#7c8dff" stroke-opacity="0.35"/>
        <text x="66" y="22" text-anchor="middle" fill="#9fb0ff">Local-first</text>
      </g>
      <g transform="translate(322 212)">
        <rect width="150" height="34" rx="17" fill="#b06bff" fill-opacity="0.14" stroke="#b06bff" stroke-opacity="0.35"/>
        <text x="75" y="22" text-anchor="middle" fill="#c9a4ff">Zero dependencies</text>
      </g>
      <g transform="translate(484 212)">
        <rect width="140" height="34" rx="17" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.3"/>
        <text x="70" y="22" text-anchor="middle" fill="#6fe3b4">Unit tested</text>
      </g>
      <g transform="translate(636 212)">
        <rect width="124" height="34" rx="17" fill="#ffc857" fill-opacity="0.12" stroke="#ffc857" stroke-opacity="0.3"/>
        <text x="62" y="22" text-anchor="middle" fill="#ffd584">MIT licensed</text>
      </g>
    </g>

    <!-- stylised app window -->
    <g transform="translate(856 54)" opacity="0.96">
      <rect width="292" height="212" rx="16" fill="#0e1220" stroke="#242c42"/>
      <rect x="0" y="0" width="292" height="34" rx="16" fill="#141a2b"/>
      <rect x="0" y="22" width="292" height="12" fill="#141a2b"/>
      <circle cx="18" cy="17" r="4" fill="#ff6b6b" opacity="0.75"/>
      <circle cx="32" cy="17" r="4" fill="#ffc857" opacity="0.75"/>
      <circle cx="46" cy="17" r="4" fill="#3ddc97" opacity="0.75"/>

      <rect x="14" y="48" width="104" height="18" rx="9" fill="#1b2235"/>
      <rect x="14" y="76" width="104" height="40" rx="8" fill="#171d2e" stroke="#7c8dff" stroke-opacity="0.5"/>
      <rect x="22" y="84" width="60" height="7" rx="3.5" fill="#8f9cc4"/>
      <rect x="22" y="97" width="80" height="6" rx="3" fill="#47506c"/>
      <rect x="14" y="124" width="104" height="40" rx="8" fill="#171d2e"/>
      <rect x="22" y="132" width="52" height="7" rx="3.5" fill="#6c7693"/>
      <rect x="22" y="145" width="76" height="6" rx="3" fill="#3b4360"/>
      <rect x="14" y="172" width="104" height="26" rx="8" fill="#171d2e"/>

      <rect x="132" y="48" width="146" height="14" rx="7" fill="#2b3350"/>
      <rect x="132" y="72" width="146" height="94" rx="8" fill="#171d2e"/>
      <rect x="142" y="84" width="96" height="6" rx="3" fill="#4d567a"/>
      <rect x="142" y="98" width="126" height="6" rx="3" fill="#3a4262"/>
      <rect x="142" y="112" width="58" height="6" rx="3" fill="#7c8dff" opacity="0.8"/>
      <rect x="206" y="112" width="48" height="6" rx="3" fill="#3a4262"/>
      <rect x="142" y="126" width="110" height="6" rx="3" fill="#3a4262"/>
      <rect x="142" y="140" width="72" height="6" rx="3" fill="#3a4262"/>
      <rect x="132" y="176" width="68" height="22" rx="11" fill="#7c8dff"/>
      <rect x="210" y="176" width="68" height="22" rx="11" fill="#232b42"/>
    </g>
  </g>
</svg>
