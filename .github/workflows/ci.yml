name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: No-build sanity checks (asset paths, icon ids, element ids)
        run: node scripts/check-html.js

      - name: Unit tests
        run: npm test

  verify-static-site:
    name: Verify the static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: index.html must stay at the repository root
        run: test -f index.html

      - name: The site must serve and expose its assets
        run: |
          node scripts/serve.js &
          SERVER_PID=$!
          sleep 2
          set -e
          for path in / /assets/css/tokens.css /assets/css/base.css \
                      /assets/css/components.css /assets/css/layout.css \
                      /assets/js/app.js /assets/js/core/schema.js \
                      /assets/js/core/search.js /assets/js/core/variables.js \
                      /assets/js/core/library.js /assets/js/core/storage.js \
                      /assets/js/core/starter-prompts.js /assets/img/favicon.svg; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000$path")
            echo "$code  $path"
            [ "$code" = "200" ] || { kill $SERVER_PID; exit 1; }
          done
          kill $SERVER_PID
