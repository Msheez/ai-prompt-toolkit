name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: No-build sanity checks (asset paths, icon ids, element ids)
        run: node scripts/check-html.js

      - name: Unit tests
        run: npm test

  verify-static-site:
    name: Build and verify the static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: index.html must stay at the repository root
        run: test -f index.html

      - name: The repository root must serve every file the app needs
        run: node scripts/verify-site.js

      - name: The production build must succeed
        run: npm run build

      - name: The built site must serve every file the app needs
        run: SERVE_DIR=dist node scripts/verify-site.js
